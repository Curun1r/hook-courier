services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hookcourier_test
      POSTGRES_USER: hookcourier_test
      POSTGRES_PASSWORD: disposable-test-password
    ports:
      - "127.0.0.1:${TEST_DB_PORT:-25432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hookcourier_test -d hookcourier_test"]
      interval: 2s
      timeout: 3s
      retries: 20
