name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Python checks and PostgreSQL tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hookcourier_ci
          POSTGRES_USER: hookcourier_ci
          POSTGRES_PASSWORD: hookcourier_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hookcourier_ci -d hookcourier_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: ci-only-secret-key-for-disposable-test-environments
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      HOOKCOURIER_API_KEY: ci-only-api-key
      DB_ENGINE: postgresql
      POSTGRES_DB: hookcourier_ci
      POSTGRES_USER: hookcourier_ci
      POSTGRES_PASSWORD: hookcourier_ci_password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      CELERY_BROKER_URL: memory://
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Check lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Check Django configuration
        run: python src/manage.py check
      - name: Check migration files
        run: python src/manage.py makemigrations --check --dry-run
      - name: Run tests on PostgreSQL
        run: python -m pytest -q -ra --strict-markers
