x-app: &app
  build: .
  image: hookcourier:production
  env_file: ${HOOKCOURIER_ENV_FILE:-.env.production}
  environment:
    DJANGO_SETTINGS_MODULE: config.settings_production
    DB_HOST: db
    DB_PORT: 5432
    CELERY_BROKER_URL: redis://redis:6379/0

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis_data:/data

  migrate:
    <<: *app
    command: python src/manage.py migrate --noinput
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *app
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOOKCOURIER_HTTP_PORT:-18001}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; req = urllib.request.Request('http://127.0.0.1:8000/healthz/', headers={'Host': os.environ['DJANGO_ALLOWED_HOSTS'].split(',')[0].strip()}); urllib.request.urlopen(req, timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 10s

  worker:
    <<: *app
    working_dir: /app/src
    command: celery -A config worker --loglevel=INFO --concurrency=2
    restart: unless-stopped
    stop_grace_period: 45s
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  receiver:
    build: .
    image: hookcourier:production
    profiles: [demo]
    command: python /app/demo/receiver.py
    environment:
      DEMO_FAILURES_BEFORE_SUCCESS: 2
    networks:
      default:
        aliases:
          - receiver.local
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health/', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
  redis_data:
